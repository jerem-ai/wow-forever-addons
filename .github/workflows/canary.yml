name: CurseForge canary

# Every day, check that each addon in addons.json still resolves to a WoW Forever file on
# CurseForge that downloads and unzips. A failed run emails the repo owner.
on:
  schedule:
    - cron: '17 15 * * *'
  push:
    paths: ['addons.json', 'SquadUI.zip', 'ui/**', '*.py', '*.ps1', 'test_squad_ui.lua', '.github/workflows/canary.yml']
  workflow_dispatch:
    inputs:
      extra_ids:
        description: Extra CurseForge project IDs to check, space separated (a bad one should fail the run)
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Mac and Linux installer behavior
        run: python3 -m unittest -v
      - name: Check the UI preset with Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 test_squad_ui.lua
      - name: Check every addon
        env:
          EXTRA_IDS: ${{ inputs.extra_ids }}
        run: python3 sync.py --check --addons addons.json --extra-ids $EXTRA_IDS
      # GitHub pauses scheduled workflows after 60 days without repo activity; re-enabling resets that.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/canary.yml/enable"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows profile behavior
        shell: powershell
        run: ./test_windows.ps1
